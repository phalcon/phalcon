# Rebuilds the roster in README.md every day from the phalcon/assets roster.
# The reusable workflow of phalcon/assets does the work. When the roster
# changed, it opens a pull request "Updating the backers roster" to v6.0.x.
# phalcon/assets publishes its roster after 04:17 UTC, so this job runs one
# hour later.
name: Update backers

on:
  schedule:
    - cron: "17 5 * * *"

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  backers:
    uses: phalcon/assets/.github/workflows/backers.yml@b3055cf85324e92ce745a3e8aeb73feb756a7541 # master
